name: 学习打卡

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '打卡') || contains(github.event.issue.labels.*.name, '打卡')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析并提交打卡数据
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node studio-site/scripts/parse-checkin.mjs

      - name: 关闭 issue 并确认
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RUNNER_TEMP/checkin-result.txt")"

      - name: 打卡格式有误，评论提示
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RUNNER_TEMP/checkin-error.txt")" || true
